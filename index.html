<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#ff3f6c">
<title>ShopBD — ইউজার প্যানেল</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
  --pri:#ff3f6c; --pri2:#ff7a45; --dark:#16162a; --gray:#8a8a9e;
  --line:#ececf1; --bg:#f5f6fa; --green:#12b76a; --card:#fff;
}
body{font-family:'Hind Siliguri','Noto Sans Bengali',system-ui,-apple-system,'Segoe UI',sans-serif;
  background:var(--bg);color:var(--dark);-webkit-font-smoothing:antialiased}
#app{max-width:480px;margin:0 auto;min-height:100vh;background:var(--bg);
  position:relative;padding-bottom:78px;overflow-x:hidden}
#app.no-nav{padding-bottom:0}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,select,textarea{font-family:inherit;font-size:15px;outline:none;border:none}
img{max-width:100%}

/* ---------- HEADER ---------- */
.header{position:sticky;top:0;z-index:50;background:#fff;border-bottom:1px solid var(--line)}
.hrow{display:flex;align-items:center;gap:9px;padding:12px 14px}
.logo{font-weight:800;font-size:19px;flex:1;white-space:nowrap;
  background:linear-gradient(90deg,var(--pri),var(--pri2));
  -webkit-background-clip:text;background-clip:text;color:transparent}
.icon-btn{position:relative;width:38px;height:38px;border-radius:50%;display:grid;
  place-items:center;font-size:17px;background:#f5f6fa;flex:none;transition:.15s}
.icon-btn:active{transform:scale(.92)}
.badge{position:absolute;top:-3px;right:-3px;background:var(--pri);color:#fff;font-size:10px;
  font-weight:700;min-width:18px;height:18px;border-radius:9px;display:grid;place-items:center;
  padding:0 4px;border:2px solid #fff}
.searchbar{display:flex;align-items:center;gap:8px;background:#f5f6fa;border-radius:11px;
  padding:11px 13px;color:var(--gray);font-size:13.5px}
.hsearch{padding:0 14px 12px}
.page-hdr{display:flex;align-items:center;gap:10px;padding:10px 14px}
.page-hdr h2{font-size:16.5px;font-weight:700;flex:1;text-align:center;padding-right:38px}

/* ---------- COMMON ---------- */
.wrap{padding:14px}
.card{background:#fff;border-radius:14px;padding:14px;margin-bottom:12px;
  box-shadow:0 1px 4px rgba(0,0,0,.04)}
.card h4{font-size:14px;font-weight:700;margin-bottom:12px}
.inp{width:100%;background:#f5f6fa;border-radius:10px;padding:13px;font-size:14.5px;
  margin-bottom:10px;border:1.5px solid transparent;transition:.15s}
.inp:focus{border-color:var(--pri);background:#fff}
.empty{text-align:center;color:var(--gray);padding:60px 20px;font-size:14px;line-height:2}
.empty .big{font-size:52px;display:block;margin-bottom:6px}
.btn{display:block;width:100%;padding:15px;border-radius:12px;
  background:linear-gradient(90deg,var(--pri),var(--pri2));color:#fff;font-weight:700;
  font-size:15px;text-align:center;transition:.15s}
.btn:active{transform:scale(.98);opacity:.9}
.btn.out{background:#fff;border:1.5px solid var(--pri);color:var(--pri)}
.btn.gray{background:#f0f0f5;color:var(--dark)}
.btn:disabled{opacity:.5}
.sec{display:flex;justify-content:space-between;align-items:center;padding:18px 14px 10px}
.sec h3{font-size:16px;font-weight:700}
.sec a{font-size:12.5px;color:var(--pri);font-weight:600}

/* ---------- BANNER ---------- */
.banner{margin:14px;border-radius:18px;padding:22px 20px;color:#fff;
  background:linear-gradient(120deg,#ff3f6c,#ff7a45 70%,#ffb03a);
  position:relative;overflow:hidden;box-shadow:0 8px 22px rgba(255,63,108,.28)}
.banner::after{content:'🎁';position:absolute;right:-10px;bottom:-18px;font-size:100px;opacity:.18}
.banner .btag{display:inline-block;background:rgba(255,255,255,.25);font-size:11px;
  font-weight:700;padding:4px 10px;border-radius:20px;margin-bottom:10px}
.banner h2{font-size:24px;font-weight:800;margin-bottom:4px}
.banner p{font-size:12.5px;opacity:.95;margin-bottom:14px}
.bbtn{background:#fff;color:var(--pri);font-weight:700;font-size:13px;
  padding:9px 18px;border-radius:10px;position:relative;z-index:2}

/* ---------- CATEGORY ---------- */
.cats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;padding:0 14px}
.cat{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:10.5px;
  font-weight:600;text-align:center;line-height:1.3}
.cat .ci{width:58px;height:58px;border-radius:18px;display:grid;place-items:center;
  font-size:26px;background:#fff;box-shadow:0 2px 8px rgba(0,0,0,.06);transition:.15s}
.cat:active .ci{transform:scale(.93)}

/* ---------- PRODUCT CARD ---------- */
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:0 14px 14px}
.pcard{background:#fff;border-radius:14px;overflow:hidden;position:relative;
  box-shadow:0 1px 5px rgba(0,0,0,.05);transition:.15s}
.pcard:active{transform:scale(.97)}
.pimg{height:122px;display:grid;place-items:center;font-size:48px;position:relative}
.pinfo{padding:8px 10px 12px}
.pname{font-size:12.3px;font-weight:600;line-height:1.4;height:35px;overflow:hidden;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.price{font-size:14px;font-weight:800;color:var(--pri);margin-top:5px}
.price s{font-size:11px;color:var(--gray);font-weight:500;margin-left:4px}
.rate{font-size:10.5px;color:var(--gray);margin-top:3px}
.wish{position:absolute;top:6px;right:6px;width:28px;height:28px;border-radius:50%;
  background:rgba(255,255,255,.92);display:grid;place-items:center;font-size:13px;
  box-shadow:0 1px 4px rgba(0,0,0,.1)}
.disc{position:absolute;top:6px;left:6px;background:var(--green);color:#fff;font-size:9.5px;
  font-weight:700;padding:3px 6px;border-radius:6px}
.hscroll{display:flex;gap:12px;overflow-x:auto;padding:0 14px 6px;scrollbar-width:none}
.hscroll::-webkit-scrollbar{display:none}
.hscroll .pcard{min-width:152px;flex:none}

/* ---------- BOTTOM NAV ---------- */
.bnav{position:fixed;bottom:0;left:0;right:0;max-width:480px;margin:0 auto;background:#fff;
  border-top:1px solid var(--line);display:flex;z-index:60;
  padding:6px 0 calc(6px + env(safe-area-inset-bottom))}
.bnav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;
  font-size:10px;color:var(--gray);font-weight:600;padding:4px 0;position:relative}
.bnav button.active{color:var(--pri)}
.bnav .bi{font-size:20px;line-height:1}
.bnav .nbadge{position:absolute;top:-1px;right:calc(50% - 20px);background:var(--pri);color:#fff;
  font-size:9px;font-weight:700;min-width:16px;height:16px;border-radius:8px;
  display:grid;place-items:center;padding:0 3px}

/* ---------- AUTH ---------- */
.auth{min-height:100vh;background:linear-gradient(160deg,#ff3f6c,#ff7a45 55%,#ffb03a);
  padding:60px 22px 30px;display:flex;flex-direction:column}
.auth-top{text-align:center;color:#fff;margin-bottom:26px}
.auth-logo{width:78px;height:78px;border-radius:24px;background:rgba(255,255,255,.22);
  display:grid;place-items:center;font-size:40px;margin:0 auto 14px;backdrop-filter:blur(6px)}
.auth-top h1{font-size:28px;font-weight:800;letter-spacing:-.5px}
.auth-top p{font-size:13px;opacity:.92;margin-top:6px}
.auth-card{background:#fff;border-radius:22px;padding:20px;box-shadow:0 14px 40px rgba(0,0,0,.18)}
.tabs{display:flex;background:#f5f6fa;border-radius:12px;padding:4px;margin-bottom:18px}
.tab{flex:1;padding:10px;border-radius:9px;font-size:14px;font-weight:700;color:var(--gray)}
.tab.active{background:#fff;color:var(--pri);box-shadow:0 1px 5px rgba(0,0,0,.08)}

/* ---------- CART ---------- */
.citem{display:flex;gap:12px;background:#fff;border-radius:14px;padding:10px;
  margin-bottom:10px;align-items:center;box-shadow:0 1px 4px rgba(0,0,0,.04)}
.citem .ci{width:72px;height:72px;border-radius:12px;display:grid;place-items:center;
  font-size:32px;flex:none}
.citem .cm{flex:1;min-width:0}
.citem .cm h5{font-size:12.8px;font-weight:600;line-height:1.35;margin-bottom:3px;
  overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.citem .cm .meta{font-size:10.5px;color:var(--gray);margin-bottom:5px}
.qty{display:flex;align-items:center;border:1.2px solid var(--line);border-radius:9px;
  overflow:hidden;width:fit-content}
.qty button{width:30px;height:29px;font-size:16px;font-weight:700;color:var(--pri)}
.qty span{width:32px;text-align:center;font-size:13px;font-weight:700}
.rm{color:var(--gray);font-size:16px;padding:4px}

/* ---------- SIZE / COLOR CHIPS ---------- */
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.chip{padding:8px 16px;border-radius:10px;border:1.5px solid var(--line);font-size:13px;
  font-weight:600;background:#fff;transition:.15s}
.chip.on{border-color:var(--pri);background:#fff0f3;color:var(--pri)}

/* ---------- DETAIL ---------- */
.dhero{height:270px;display:grid;place-items:center;font-size:110px;position:relative}
.dbody{background:#fff;border-radius:20px 20px 0 0;margin-top:-20px;position:relative;
  padding:18px 16px 20px}
.dtitle{font-size:17px;font-weight:700;line-height:1.4}
.dprice{font-size:23px;font-weight:800;color:var(--pri);margin-top:8px}
.dprice s{font-size:14px;color:var(--gray);font-weight:500;margin-left:6px}
.doff{background:#e7f8f0;color:var(--green);font-size:11.5px;font-weight:700;
  padding:3px 8px;border-radius:6px;margin-left:8px}
.dsec{margin-top:18px}
.dsec h4{font-size:13.5px;font-weight:700;margin-bottom:8px}
.ddesc{font-size:13px;line-height:1.8;color:#555}
.feat{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.feat span{background:#f5f6fa;font-size:11.5px;padding:6px 11px;border-radius:20px;font-weight:600}

/* ---------- ACTION BAR ---------- */
.actionbar{position:fixed;bottom:0;left:0;right:0;max-width:480px;margin:0 auto;background:#fff;
  border-top:1px solid var(--line);padding:10px 14px calc(10px + env(safe-area-inset-bottom));
  display:flex;align-items:center;gap:12px;z-index:70}
.actionbar .btn{flex:1;padding:14px}
.ab-price{font-size:18px;font-weight:800;color:var(--pri)}
.actionbar small{font-size:10.5px;color:var(--gray);display:block}
.ab-icon{width:48px;height:48px;border-radius:12px;background:#f5f6fa;display:grid;
  place-items:center;font-size:20px;flex:none}

/* ---------- ORDER ---------- */
.ohead{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.oid{font-size:12.5px;font-weight:700}
.ostatus{font-size:10.5px;font-weight:700;padding:4px 10px;border-radius:20px;
  background:#fff4e5;color:#f79009}
.ostatus.done{background:#e7f8f0;color:var(--green)}
.orow{display:flex;justify-content:space-between;font-size:12.5px;color:var(--gray);
  padding:5px 0}
.srow{display:flex;justify-content:space-between;font-size:13.5px;padding:7px 0;color:#555}
.srow b{color:var(--dark);font-weight:700}
.srow.total{border-top:1px dashed var(--line);margin-top:8px;padding-top:12px;font-size:15.5px}
.srow.total b{color:var(--pri);font-size:18px}

/* ---------- TIMELINE ---------- */
.tl{padding-left:6px}
.tl-item{display:flex;gap:12px;position:relative;padding-bottom:22px}
.tl-item:last-child{padding-bottom:0}
.tl-item::before{content:'';position:absolute;left:11px;top:24px;bottom:0;width:2px;
  background:var(--line)}
.tl-item:last-child::before{display:none}
.tl-dot{width:24px;height:24px;border-radius:50%;background:#e8e8ef;color:#a5a5b8;
  display:grid;place-items:center;font-size:12px;flex:none;z-index:1}
.tl-item.done .tl-dot{background:var(--green);color:#fff}
.tl-item.done::before{background:var(--green)}
.tl-item b{font-size:13px;display:block}
.tl-item small{font-size:11px;color:var(--gray)}

/* ---------- PROFILE ---------- */
.phero{background:linear-gradient(120deg,#ff3f6c,#ff7a45);padding:24px 18px 46px;color:#fff;
  border-radius:0 0 24px 24px}
.pavatar{width:68px;height:68px;border-radius:50%;background:rgba(255,255,255,.25);
  display:grid;place-items:center;font-size:30px;margin-bottom:12px}
.phero h3{font-size:18px;font-weight:700}
.phero p{font-size:12.5px;opacity:.9;margin-top:3px}
.pstats{display:grid;grid-template-columns:repeat(3,1fr);background:#fff;border-radius:16px;
  margin:-32px 14px 12px;padding:16px 0;box-shadow:0 4px 16px rgba(0,0,0,.08)}
.pstat{text-align:center;border-right:1px solid var(--line)}
.pstat:last-child{border:none}
.pstat b{font-size:17px;display:block;color:var(--pri)}
.pstat span{font-size:11px;color:var(--gray)}
.menu{background:#fff;border-radius:14px;overflow:hidden;margin-bottom:12px;
  box-shadow:0 1px 4px rgba(0,0,0,.04)}
.mitem{display:flex;align-items:center;gap:13px;padding:15px 16px;
  border-bottom:1px solid var(--line);font-size:14px;font-weight:600}
.mitem:last-child{border:none}
.mitem .mi{width:36px;height:36px;border-radius:10px;background:#fff0f3;display:grid;
  place-items:center;font-size:16px;flex:none}
.mitem .arr{margin-left:auto;color:#c5c5d2;font-size:16px}
.mitem:active{background:#fafafc}

/* ---------- NOTIFICATION ---------- */
.nitem{display:flex;gap:12px;background:#fff;border-radius:14px;padding:14px;
  margin-bottom:10px;box-shadow:0 1px 4px rgba(0,0,0,.04);position:relative}
.nitem.unread{background:#fff8fa;border-left:3px solid var(--pri)}
.nitem .ni{width:40px;height:40px;border-radius:12px;background:#fff0f3;display:grid;
  place-items:center;font-size:18px;flex:none}
.nitem b{font-size:13.5px;display:block;margin-bottom:3px}
.nitem p{font-size:12px;color:#666;line-height:1.6}
.nitem small{font-size:10.5px;color:var(--gray);display:block;margin-top:5px}

/* ---------- SEARCH ---------- */
.searchinput{display:flex;align-items:center;gap:10px;background:#fff;border-radius:12px;
  padding:13px 14px;margin-bottom:14px;box-shadow:0 1px 4px rgba(0,0,0,.05)}
.searchinput input{flex:1;background:none;font-size:14.5px}

/* ---------- TOAST ---------- */
#toast{position:fixed;bottom:100px;left:50%;transform:translateX(-50%) translateY(20px);
  background:#16162a;color:#fff;padding:12px 22px;border-radius:30px;font-size:13px;
  font-weight:600;opacity:0;pointer-events:none;transition:.3s;z-index:999;
  max-width:88%;text-align:center;box-shadow:0 6px 22px rgba(0,0,0,.3)}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
</head>

function save(){
  LS.set('sb_user', state.user); LS.set('sb_cart', state.cart);

/* ---------------- HELPERS ---------------- */
const $  = s => document.querySelector(s);
const app = document.getElementById('app');
const money = n => '৳' + Number(n).toLocaleString('en-US');

let toastTimer;
function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>t.classList.remove('show'), 2000);
}
function keepScroll(fn){ const y = window.scrollY; fn(); window.scrollTo(0, y); }
const cartCount = () => state.cart.reduce((s,i)=>s+i.qty, 0);
const cartTotal = () => state.cart.reduce((s,i)=>{
  const p = PRODUCTS.find(x=>x.id===i.id); return s + (p ? p.price*i.qty : 0);
}, 0);
const findP = id => PRODUCTS.find(p=>p.id===id);

/* ---------------- NAVIGATION ---------------- */
const stack = [];
function go(page, param){
  stack.push({page: state.page, param: state.param});
  state.page = page; state.param = param ?? null;
  render();
}
function back(){
  const prev = stack.pop();
  if(prev){ state.page = prev.page; state.param = prev.param; }
  else { state.page = 'home'; state.param = null; }
  render();
}
function tabGo(page){ stack.length = 0; state.page = page; state.param = null; render(); }

/* ---------------- PRODUCT CARD ---------------- */
function card(p){
  const off = p.old ? Math.round((1 - p.price/p.old) * 100) : 0;
  const on = state.wish.includes(p.id);
  return `<div class="pcard" onclick="go('detail',${p.id})">
    <div class="pimg" style="background:${p.bg}">
      ${off ? `<span class="disc">-${off}%</span>` : ''}
      <span>${p.emoji}</span>
      <button class="wish" onclick="event.stopPropagation();toggleWish(${p.id})">${on?'❤️':'🤍'}</button>
    </div>
    <div class="pinfo">
      <div class="pname">${p.name}</div>
      <div class="price">${money(p.price)} ${p.old?`<s>${money(p.old)}</s>`:''}</div>
      <div class="rate">⭐ ${p.rating} · ${p.reviews} রিভিউ</div>
    </div>
  </div>`;
}

/* ---------------- WISHLIST / CART ---------------- */
function toggleWish(id){
  const i = state.wish.indexOf(id);
  if(i > -1){ state.wish.splice(i,1); toast('উইশলিস্ট থেকে সরানো হয়েছে'); }
  else { state.wish.push(id); toast('উইশলিস্টে যোগ হয়েছে ❤️'); }
  save(); keepScroll(render);
}
function addToCart(id, qty=1, size='', color=''){
  const key = id + '|' + size + '|' + color;
  const ex = state.cart.find(c=>c.key===key);
  if(ex) ex.qty += qty;
  else state.cart.push({key, id, qty, size, color});
  save(); toast('কার্টে যোগ হয়েছে ✅');
  keepScroll(render);
}
function changeQty(key, d){
  const it = state.cart.find(c=>c.key===key);
  if(!it) return;
  it.qty += d;
  if(it.qty < 1) state.cart = state.cart.filter(c=>c.key!==key);
  save(); keepScroll(render);
}
function removeItem(key){
  state.cart = state.cart.filter(c=>c.key!==key);
  save(); keepScroll(render);
  toast('কার্ট থেকে সরানো হয়েছে');
}

/* ============================================================
   RENDER ROOT
   ============================================================ */
function render(){
  if(!state.user){ app.innerHTML = authScreen(); app.classList.add('no-nav'); return; }

  const noNav = ['detail','checkout'].includes(state.page);
  app.classList.toggle('no-nav', noNav);

  app.innerHTML = header() + `<main id="content">${pageContent()}</main>` + (noNav ? '' : bottomNav());
  window.scrollTo(0, 0);
}

/* ---------------- HEADER ---------------- */
function header(){
  const p = state.page;
  if(p === 'home'){
    const unread = state.notifs.some(n=>!n.read);
    return `<div class="header">
      <div class="hrow">
        <div class="logo">🛍️ ShopBD</div>
        <button class="icon-btn" onclick="go('notifications')">🔔${unread?'<span class="badge"></span>':''}</button>
        <button class="icon-btn" onclick="go('cart')">🛒${cartCount()?`<span class="badge">${cartCount()}</span>`:''}</button>
      </div>
      <div class="hsearch">
        <div class="searchbar" onclick="go('search')">🔍 পোশাক, মোবাইল, গ্যাজেট খুঁজুন...</div>
      </div>
    </div>`;
  }
  const titles = {
    cart:'আমার কার্ট', wishlist:'উইশলিস্ট', profile:'প্রোফাইল', orders:'আমার অর্ডার',
    checkout:'চেকআউট', addresses:'ঠিকানা', notifications:'নোটিফিকেশন', detail:'পণ্যের বিবরণ',
    list:'পণ্য', category:'ক্যাটাগরি', orderDetail:'অর্ডার ডিটেইলস',
    track:'অর্ডার ট্র্যাকিং', search:'সার্চ'
  };
  return `<div class="header"><div class="page-hdr">
    <button class="icon-btn" onclick="back()">←</button>
    <h2>${titles[p] || ''}</h2>
  </div></div>`;
}

/* ---------------- BOTTOM NAV ---------------- */
function bottomNav(){
  const active = {
    home:'home', category:'category', cart:'cart', wishlist:'wishlist',
    profile:'profile', orders:'profile', addresses:'profile', notifications:'profile'
  }[state.page] || '';
  const b = (key, icon, label, badge) => `
    <button class="${active===key?'active':''}" onclick="tabGo('${key}')">
      <span class="bi">${icon}</span>${label}
      ${badge ? `<span class="nbadge">${badge}</span>` : ''}
    </button>`;
  return `<nav class="bnav">
    ${b('home','🏠','হোম')}
    ${b('category','🗂️','ক্যাটাগরি')}
    ${b('cart','🛒','কার্ট', cartCount() || '')}
    ${b('wishlist','❤️','উইশলিস্ট', state.wish.length || '')}
    ${b('profile','👤','প্রোফাইল')}
  </nav>`;
}

/* ============================================================
   PAGE ROUTER
   ============================================================ */
function pageContent(){
  switch(state.page){
    case 'home':          return homePage();
    case 'category':      return categoryPage();
    case 'list':          return listPage();
    case 'detail':        return detailPage();
    case 'cart':          return cartPage();
    case 'wishlist':      return wishlistPage();
    case 'checkout':      return checkoutPage();
    case 'orders':        return ordersPage();
    case 'orderDetail':   return orderDetailPage();
    case 'track':         return trackPage();
    case 'profile':       return profilePage();
    case 'addresses':     return addressesPage();
    case 'notifications': return notificationsPage();
    case 'search':        return searchPage();
    default:              return homePage();
  }
}

/* ============================================================
   PRODUCT LIST
   ============================================================ */
function listPage(){
  const f = state.param || {type:'all', value:''};
  let items = PRODUCTS.slice();
  let title = 'সব পণ্য';

  if(f.type === 'cat'){
    items = items.filter(p=>p.cat === f.value);
    title = f.value === 'dress' ? 'পোশাক' : 'ইলেকট্রনিক্স';
  } else if(f.type === 'sub'){
    items = items.filter(p=>p.sub === f.value);
    title = f.value;
  } else if(f.type === 'search'){
    const q = f.value.toLowerCase();
    items = items.filter(p=>p.name.toLowerCase().includes(q) || p.sub.toLowerCase().includes(q) || p.brand.toLowerCase().includes(q));
    title = `"${f.value}" এর ফলাফল`;
  }

  if(state.sort === 'low')    items.sort((a,b)=>a.price-b.price);
  if(state.sort === 'high')   items.sort((a,b)=>b.price-a.price);
  if(state.sort === 'rating') items.sort((a,b)=>b.rating-a.rating);

  const sortBar = `
    <div style="display:flex;gap:8px;padding:0 14px 12px;overflow-x:auto" class="hscroll">
      ${[['default','সব'],['low','কম দাম'],['high','বেশি দাম'],['rating','রেটিং']]
        .map(([k,l])=>`<button class="chip ${state.sort===k?'on':''}" onclick="setSort('${k}')">${l}</button>`).join('')}
    </div>`;

  if(!items.length) return sortBar + `<p class="empty"><span class="big">🔍</span>কোনো পণ্য পাওয়া যায়নি</p>`;

  return `${sortBar}
    <p style="padding:0 14px 10px;font-size:12.5px;color:var(--gray)">
      ${title} — <b style="color:var(--dark)">${items.length}</b> টি পণ্য
    </p>
    <div class="grid">${items.map(card).join('')}</div>
    <div style="height:14px"></div>`;
}
function setSort(k){ state.sort = k; keepScroll(render); }

   ============================================================ */

  if(!p) return `<p class="empty">পণ্য পাওয়া যায়নি</p>`;

  const sel = state.sel || {};
  const size  = sel.size  || (p.sizes.length ? p.sizes[0] : '');
  const color = sel.color || p.colors[0];
  const off = p.old ? Math.round((1 - p.price/p.old) * 100) : 0;
  const on = state.wish.includes(p.id);

  return `
  <div class="dhero" style="background:${p.bg}">
    ${p.emoji}
    <button class="wish" style="top:14px;right:14px;width:38px;height:38px;font-size:17px"
      onclick="toggleWish(${p.id})">${on?'❤️':'🤍'}</button>

    <div class="dprice">

      <span>⭐ <b style="color:var(--dark)">${p.rating}</b> (${p.reviews})</span>
      <span>📦 স্টকে: <b style="color:${p.stock>5?'var(--green)':'#f79009'}">${p.stock} টি</b></span>
    </div>

function placeOrder(){
  const name  = ($('#coName')?.value  || '').trim();
  const phone = ($('#coPhone')?.value || '').trim();
  const addr  = ($('#coAddr')?.value  || '').trim();
  const city  = ($('#coCity')?.value  || '').trim();
  const pay   = document.querySelector('input[name="pay"]:checked')?.value || 'ক্যাশ অন ডেলিভারি';

  if(!name)  return toast('নাম লিখুন');
  if(!/^01\d{9}$/.test(phone)) return toast('সঠিক ১১ ডিজিটের মোবাইল নম্বর দিন');
  if(!addr)  return toast('ঠিকানা লিখুন');
  if(!city)  return toast('জেলা / শহর লিখুন');

  const sub  = cartTotal();
  const ship = sub >= 2000 ? 0 : 60;
  const disc = state.coupon ? Math.round(sub * 0.10) : 0;

  const order = {
    id: 'ORD' + String(Date.now()).slice(-8),
    items: state.cart.map(i=>{
      const p = findP(i.id);
      return {id:i.id, name:p.name, emoji:p.emoji, bg:p.bg, price:p.price, qty:i.qty, size:i.size, color:i.color};
    }),
    subtotal: sub, ship, disc, total: sub + ship - disc,
    name, phone, address: addr, city, payment: pay,
    status: 0,
    date: new Date().toLocaleDateString('bn-BD', {day:'numeric', month:'long', year:'numeric'})
  };

  state.orders.unshift(order);
  state.cart = [];
  state.coupon = null;
  state.notifs.unshift({
    id: Date.now(), icon:'📦', title:'অর্ডার সফল হয়েছে',
    body:`আপনার অর্ডার ${order.id} কনফার্ম হয়েছে।`, time:'এইমাত্র', read:false
  });
  save();

  stack.length = 0;
  state.page = 'orderDetail';
  state.param = order.id;
  render();
  toast('🎉 অর্ডার সফলভাবে সম্পন্ন হয়েছে!');
}

      <input id="adName"  class="inp" placeholder="প্রাপকের নাম *">
      <input id="adPhone" class="inp" type="tel" placeholder="মোবাইল নম্বর *">
      <textarea id="adText" class="inp" rows="3" placeholder="সম্পূর্ণ ঠিকানা *"></textarea>
      <input id="adCity"  class="inp" placeholder="জেলা / শহর *">
      <div style="display:flex;gap:8px">
        <button class="btn gray" onclick="toggleAddrForm()">বাতিল</button>
        <button class="btn" onclick="saveAddr()">সেভ করুন</button>
      </div>
    </div>` : `
    <button class="btn out" style="margin-bottom:14px" onclick="toggleAddrForm()">+ নতুন ঠিকানা যোগ করুন</button>`;

  const list = state.addr.length ? state.addr.map((a,i)=>`
    <div class="card">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">
        <b style="font-size:13px">${a.label || 'ঠিকানা'}</b>
        <button class="rm" onclick="delAddr(${i})">🗑️</button>
      </div>
      <p style="font-size:13px;line-height:1.9;color:#555">
        <b style="color:var(--dark)">${a.name}</b><br>
        ${a.text}<br>${a.city}<br>📞 ${a.phone}
      </p>
    </div>`).join('') : `<p class="empty" style="padding:30px">কোনো ঠিকানা সেভ করা নেই</p>`;

  return `<div class="wrap">${form}${list}</div>`;
}

function saveAddr(){
  const label = $('#adLabel').value.trim();
  const name  = $('#adName').value.trim();
  const phone = $('#adPhone').value.trim();
  const text  = $('#adText').value.trim();
  const city  = $('#adCity').value.trim();

  if(!name) return toast('নাম লিখুন');
  if(!/^01\d{9}$/.test(phone)) return toast('সঠিক মোবাইল নম্বর দিন');
  if(!text) return toast('ঠিকানা লিখুন');
  if(!city) return toast('জেলা / শহর লিখুন');

  state.addr.push({label, name, phone, text, city});
  save(); showAddrForm = false; render();
  toast('ঠিকানা সেভ হয়েছে ✅');
}
function delAddr(i){
  state.addr.splice(i,1); save(); keepScroll(render); toast('ঠিকানা মুছে ফেলা হয়েছে');
}

/* ============================================================
   NOTIFICATIONS
   ============================================================ */
function notificationsPage(){
  if(!state.notifs.length) return `<p class="empty"><span class="big">🔔</span>কোনো নোটিফিকেশন নেই</p>`;

  return `<div class="wrap">
    <button class="btn gray" style="margin-bottom:14px;padding:11px"
      onclick="markAllRead()">সব পড়া হিসেবে চিহ্নিত করুন</button>
    ${state.notifs.map(n=>`
      <div class="nitem ${n.read?'':'unread'}">
        <div class="ni">${n.icon}</div>
        <div>
          <b>${n.title}</b>
          <p>${n.body}</p>
          <small>${n.time}</small>
        </div>
      </div>`).join('')}
  </div>`;
}
function markAllRead(){
  state.notifs.forEach(n=>n.read = true);
  save(); keepScroll(render); toast('সব নোটিফিকেশন পড়া হয়েছে');
}

/* ============================================================
   SEARCH
   ============================================================ */
function searchPage(){
  return `<div class="wrap">
    <div class="searchinput">
      <span>🔍</span>
      <input id="sq" placeholder="পণ্যের নাম লিখুন..." oninput="doSearch(this.value)" autofocus>
    </div>
    <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px">
      ${['পাঞ্জাবি','কুর্তি','মোবাইল','ইয়ারবাড','ঘড়ি','ল্যাপটপ','টিভি']
        .map(t=>`<button class="chip" onclick="quickSearch('${t}')">${t}</button>`).join('')}
    </div>
    <div id="sres"><p class="empty" style="padding:40px 0">পণ্যের নাম লিখে সার্চ করুন...</p></div>
  </div>`;
}
function quickSearch(t){
  const inp = $('#sq'); if(inp) inp.value = t;
  doSearch(t);
}
function doSearch(q){
  const box = $('#sres'); if(!box) return;
  q = (q || '').trim();
  if(!q){ box.innerHTML = '<p class="empty" style="padding:40px 0">পণ্যের নাম লিখে সার্চ করুন...</p>'; return; }
  const items = PRODUCTS.filter(p =>
    p.name.toLowerCase().includes(q.toLowerCase()) ||
    p.sub.toLowerCase().includes(q.toLowerCase()) ||
    p.brand.toLowerCase().includes(q.toLowerCase())
  );
  box.innerHTML = items.length
    ? `<p style="font-size:12.5px;color:var(--gray);margin-bottom:10px">
         <b style="color:var(--dark)">${items.length}</b> টি ফলাফল পাওয়া গেছে</p>
       <div class="grid" style="padding:0">${items.map(card).join('')}</div>`
    : `<p class="empty" style="padding:40px 0"><span class="big">😕</span>কোনো পণ্য পাওয়া যায়নি</p>`;
}

/* ============================================================
   AUTH SCREEN
   ============================================================ */
function authScreen(){
  const isLogin = state.authMode === 'login';
  return `
  <div class="auth">
    <div class="auth-top">
      <div class="auth-logo">🛍️</div>
      <h1>ShopBD</h1>
      <p>পোশাক ও ইলেকট্রনিক্স — সব এক জায়গায়</p>
    </div>

    <div class="auth-card">
      <div class="tabs">
        <button class="tab ${isLogin?'active':''}" onclick="setAuth('login')">লগইন</button>
        <button class="tab ${!isLogin?'active':''}" onclick="setAuth('reg')">রেজিস্টার</button>
      </div>

      ${!isLogin ? `<input id="auName" class="inp" placeholder="পূর্ণ নাম *">` : ''}
      <input id="auPhone" class="inp" type="tel" placeholder="মোবাইল নম্বর *" maxlength="11">
      ${!isLogin ? `<input id="auEmail" class="inp" type="email" placeholder="ইমেইল (ঐচ্ছিক)">` : ''}
      <input id="auPass" class="inp" type="password" placeholder="পাসওয়ার্ড *">

      <button class="btn" style="margin-top:6px" onclick="doAuth()">
        ${isLogin ? 'লগইন করুন' : 'অ্যাকাউন্ট তৈরি করুন'}
      </button>

      <button class="btn gray" style="margin-top:10px" onclick="demoLogin()">
        👤 ডেমো অ্যাকাউন্টে প্রবেশ
      </button>

      <p style="text-align:center;font-size:11.5px;color:var(--gray);margin-top:16px;line-height:1.7">
        লগইন করলে আপনি আমাদের<br>
        <b style="color:var(--pri)">শর্তাবলী ও প্রাইভেসি পলিসি</b> মেনে নিচ্ছেন
      </p>
    </div>
  </div>`;
}

function setAuth(mode){ state.authMode = mode; render(); }

function doAuth(){
  const isLogin = state.authMode === 'login';
  const phone = ($('#auPhone')?.value || '').trim();
  const pass  = ($('#auPass')?.value  || '').trim();

  if(!/^01\d{9}$/.test(phone)) return toast('সঠিক ১১ ডিজিটের মোবাইল নম্বর দিন');
  if(pass.length < 4) return toast('পাসওয়ার্ড কমপক্ষে ৪ অক্ষরের হতে হবে');

  if(isLogin){
    const saved = LS.get('sb_account', null);
    if(saved && saved.phone === phone && saved.pass === pass){
      state.user = {name: saved.name, phone: saved.phone, email: saved.email || ''};
    } else if(saved && saved.phone === phone){
      return toast('❌ পাসওয়ার্ড ভুল হয়েছে');
    } else {
      state.user = {name: 'গ্রাহক', phone, email: ''};
    }
  } else {
    const name = ($('#auName')?.value || '').trim();
    const email = ($('#auEmail')?.value || '').trim();
    if(!name) return toast('নাম লিখুন');
    state.user = {name, phone, email};
    LS.set('sb_account', {name, phone, email, pass});
  }

  LS.set('sb_user', state.user);
  state.page = 'home'; stack.length = 0;
  render();
  toast(`স্বাগতম, ${state.user.name}! 🎉`);
}

function demoLogin(){
  state.user = {name:'রাকিব হাসান', phone:'01712345678', email:'rakib@example.com'};
  LS.set('sb_user', state.user);
  state.page = 'home'; stack.length = 0;
  render();
  toast('ডেমো অ্যাকাউন্টে স্বাগতম 🎉');
}

/* ============================================================
   INIT
   ============================================================ */
render();
</script>
</body>
</html>
